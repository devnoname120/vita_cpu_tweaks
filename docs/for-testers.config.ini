# vita_prefetch_enabler -- goes at ur0:data/prefetch_enabler.ini
#
# INI-style: the .ini extension is only for editor syntax highlighting; there
# are no [sections], just key = value lines. '#' starts a comment.
# LF, CRLF and bare CR line endings all work, as does a UTF-8 BOM, so it is
# safe to edit on Windows, macOS or Linux.
#
# One reboot per step; read ur0:data/prefetch_enabler.log after each, then
# re-enable the plugin's line in ur0:tai/config.txt for the next step.


# Step 1 (as shipped): probe -- read-only, makes NO secure writes.
# Step 2: apply       -- writes the register fields below.
# Step 3: bench       -- memory benchmark 30 s after boot; leave the Vita on
#                        the home screen for two minutes, then send the log.
mode = probe

# Keep this at yes while testing: the plugin disables its own config.txt
# line at every boot, so a hang is fixed by simply power-cycling.
self_disable = yes

# Cortex-A9 ACTLR bit 1, firmware: off. Gives all of the A9-side gain.
actlr.l2_prefetch_hint = on

# Cortex-A9 ACTLR bit 2, firmware: off. Measured to do nothing; left alone.
actlr.l1_dside_prefetch = keep

# PL310 bit 28, firmware: off. L2 data prefetch, used with the offset below.
pl310.data_prefetch = on

# PL310 bits 4:0, firmware: 0. How far ahead the L2 prefetches.
# DO NOT USE 23 (ARM errata 765569: prefetch can cross a 4 KB page).
pl310.prefetch_offset = 15

# Benchmark at the clocks games use (CPU 500 MHz, bus 222, crossbar 166).
bench.clocks = max
