# vita_cpu_tweaks -- goes at ur0:data/cpu_tweaks.ini
#
# INI-style: the .ini extension is only for editor syntax highlighting; there
# are no [sections], just key = value lines. '#' starts a comment, also after
# a value. LF, CRLF and bare CR line endings all work, as does a UTF-8 BOM,
# so it is safe to edit on Windows, macOS or Linux.
#
# Register fields take on | off | keep. "keep" (also what you get if a key is
# missing) leaves the firmware's value alone; "off" actively clears it. The
# register values below are the measured-best settings.
#
# ---- Testing plan: one reboot per step ----
# Step 1 (as shipped): probe = on, enable = off
#         read-only, makes NO secure writes.
# Step 2: probe = off, enable = on
#         writes the register fields below.
# Step 3: benchmark = once
#         memory benchmark at the next boot, after which the Vita reboots by
#         itself; send ur0:data/cpu_tweaks_bench.log afterwards.
# After each step, send ur0:data/cpu_tweaks.log, then re-enable the plugin's
# line in ur0:tai/config.txt (it disables itself every boot) for the next one.
# Keep self_disable = yes and log = on while testing.


# on: apply the register fields below at every boot the plugin runs. The
#     PL310 fields are secure MMIO writes; the ACTLR fields run a short stub
#     in secure world on each core.
enable = off

# on: read-only recon - logs CPU/PL310 IDs and the secure page-table layout
#     to ur0:data/cpu_tweaks.log. Makes NO secure writes, and can be
#     combined with enable.
probe = on

# once: run a memory benchmark across prefetch settings at the next boot
#       (see the benchmark.* keys at the end), then reboot the console. It
#       runs whatever enable is set to. The plugin first switches this line
#       to "benchmark = off", so the reboot boots with everything else
#       exactly as configured here. Results go to
#       ur0:data/cpu_tweaks_bench.log. Nothing is applied on the
#       benchmark boot itself: the run starts from the firmware's values.
benchmark = off

# yes: the plugin comments out its own ur0:tai/config.txt line as the very
#      first thing it does, so if a boot ever hangs, a plain power-cycle boots
#      without it. Re-enable the line to run it again.
# no:  stays enabled and applies the settings on every boot. Only use this
#      once enable = on has booted cleanly on your unit.
self_disable = yes

# on:  write ur0:data/cpu_tweaks.log on every boot the plugin runs.
# off: write nothing on a clean boot. If anything fails, aborts or a config
#      line is not understood, the log is still written, so problems are
#      never silent. Benchmark results always go to their own file.
log = on


# ---- Cortex-A9 ACTLR (Auxiliary Control Register), all four cores ----
#
# (Exclusive L1/L2 mode, ACTLR bit 7, is deliberately not offered: it must
# match PL310 AUX_CTRL bit 12, which is 0 and can only change with the L2
# disabled, so setting it would break cache coherency.)

# Bit 1, firmware: off. Lets the A9 send prefetch hints to the L2 controller.
# Measured: this bit gives all of the A9-side gain (stride-4 loads 17.9 -> 10.3
# cycles at 500 MHz on its own).
actlr.l2_prefetch_hint = on

# Bit 2, firmware: off. The L1 data-side stride prefetcher. Measured to do
# nothing on this chip, alone or combined with the others, so left alone.
actlr.l1_dside_prefetch = keep

# Bit 3, firmware: on. Whole-line zero writes go straight to L2 without a
# linefill. Needs PL310 AUX_CTRL bit 0, which is on.
actlr.write_full_zeros = keep

# Bit 8, firmware: on. "Allocate in one cache way only" - despite the name it
# was measured to make no difference: all of L1 stays usable either way.
actlr.alloc_one_way = keep


# ---- ARM PL310 L2C-310 prefetch control register ----

# Bit 28, firmware: off. L2 data prefetch. Only worth it with a non-zero
# prefetch_offset: at offset 0 it adds nothing over the A9's own prefetcher
# and slows strides of 64 bytes and up.
pl310.data_prefetch = on

# Bits 4:0, firmware: 0. How many cache lines ahead the L2 prefetches:
# 0-7, 15, 23 or 31, or keep. 15 measured best overall; 31 is better only for
# very large strides.
# DO NOT USE 23: ARM errata 765569 - with offset 23 the prefetcher can cross a
# 4 KB page boundary, into memory it must not touch. This PL310 revision
# (r3p1-50rel0) is affected.
pl310.prefetch_offset = 15

# Bit 29, firmware: on. L2 instruction prefetch.
pl310.instr_prefetch = keep

# Bit 24, firmware: on. Drop prefetches the interconnect cannot take quickly.
pl310.prefetch_drop = keep

# Bit 30, firmware: off. DO NOT ENABLE: ARM errata 752271 - double linefill
# can CORRUPT DATA on PL310 r3p0-r3p1, and this unit's is r3p1-50rel0.
# Accepted only for experiments.
pl310.double_linefill = keep

# Bit 23, firmware: off. Double linefill for incrementing bursts. Reported to
# hurt read throughput elsewhere; untested here.
pl310.incr_double_linefill = keep


# ---- benchmark = once only ----

# max: raise the clocks to what games use - CPU 500 MHz, bus 222, GPU 222,
#      GPU crossbar 166 - for the run, then put them back.
# keep: benchmark at whatever the system is using.
benchmark.clocks = max

# home: (default) start 30 s after boot, with the home screen running.
# boot: run during boot, before the home screen starts, on a near-idle
#       system - cleaner numbers, especially for DRAM-bound tests. The screen
#       stays on the boot logo for about a minute, then the console reboots.
benchmark.timing = home
